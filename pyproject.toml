[project]
name = "Music-Project"
version = "0.1.0"
description = "Just trying to be a better recommender"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "psycopg2-binary",
    "python-dotenv",
    "datasets",
    "huggingface-hub",
    "torch",
    "torchaudio",
    "ipykernel>=7.3.0",
    "pyarrow>=25.0.1",
    "librosa>=0.11.0",
    "pydub>=0.25.1",
    "ffmpeg>=1.4",
    "transformers==4.44.0",
    "nnaudio>=0.3.4",
    "langdetect>=1.0.9",
    "streamlit>=1.64.0",
    "pycountry>=26.2.16",
    "requests>=2.34.2",
]


[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu121", marker = "sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu121", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
